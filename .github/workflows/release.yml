name: release.yml
on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-main
  cancel-in-progress: false

jobs:
  check-version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      exists: ${{ steps.check-version.outputs.exists }}

    steps:
      - name: checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: setup JDK
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6

      - name: get project version
        id: get-version
        shell: bash
        run: |
          VERSION=$(./gradlew -q properties | awk -F ': ' '$1 == "version" { print $2; exit }')

          if [ -z "$VERSION" ]; then
            echo "Failed to retrieve project version"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: check if version already exists
        id: check-version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release v${VERSION} already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

  build-jars:
    needs: check-version
    if: needs.check-version.outputs.exists == 'false'
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: setup JDK
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6

      - name: build project
        run: ./gradlew shadowJar

      - name: collect jars
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          shopt -s nullglob

          for module in cli cli-agent node; do
            jars=("$module"/build/libs/*.jar)

            if [ ${#jars[@]} -eq 0 ]; then
              echo "No JAR found for $module"
              exit 1
            fi

            for jar in "${jars[@]}"; do
              cp "$jar" "release-assets/${module}-$(basename "$jar")"
            done
          done

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-jars
          path: release-assets/*
          if-no-files-found: error

  build-native:
    needs: check-version
    if: needs.check-version.outputs.exists == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            ext: .exe
          - os: macos-latest
            platform: macos-arm64
            ext: ''
    runs-on: ${{ matrix.os }}

    steps:
      - name: checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ github.token }}

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6

      - name: build native executables
        shell: bash
        run: ./gradlew nativeCompile

      - name: collect native executables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          for module in cli cli-agent node; do
            case "$module" in
              cli) binary="knot-cli" ;;
              cli-agent) binary="knot-cli-agent" ;;
              node) binary="knot-node" ;;
            esac

            src="$module/build/native/nativeCompile/${binary}${{ matrix.ext }}"
            dst="release-assets/${binary}-${{ needs.check-version.outputs.version }}-${{ matrix.platform }}${{ matrix.ext }}"

            if [ ! -f "$src" ]; then
              echo "Executable not found at $src"
              exit 1
            fi

            cp "$src" "$dst"
          done

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: [check-version, build-native]
    if: |
      always() &&
      needs.check-version.outputs.exists == 'false' &&
      needs.check-version.result != 'failure' &&
      needs.check-version.result != 'cancelled' &&
      needs.build-native.result != 'cancelled' &&
      needs.build-jars.result != 'cancelled'
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-assets-*
          merge-multiple: true

      - name: list release assets
        run: ls -l release-assets

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          gh release create "v${VERSION}" release-assets/* --title "v${VERSION}" --generate-notes --target "${GITHUB_SHA}"